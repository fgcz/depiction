name: PR Checks
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install nox
        shell: bash
        run: pip install nox[uv]
      - name: Run unit tests
        run: nox
  # There is deliberately no system_tests job: the only fixture is a 1.26 GB acquisition
  # that cannot be committed, and the assertions are pinned to it. See system_tests/README.md.
