name: PR Checks
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install nox
        shell: bash
        run: pip install nox[uv]
      - name: Run unit tests
        run: nox
  # A separate job rather than another `nox` session in the one above, so that a pipeline run
  # measured in minutes never sits in front of the lint and unit-test feedback.
  system_tests:
    name: System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Keyed on the manifest itself, so changing a URL or a checksum invalidates the cache
      # rather than silently reusing the file it used to describe.
      - name: Restore the public acquisition
        uses: actions/cache@v6
        with:
          path: .test-data
          key: test-data-${{ hashFiles('tests/real_data/datasets.py') }}
      # Stdlib only, so this runs before anything is installed. Only the 59 MB public pair --
      # the 1.26 GB FGCZ acquisition is not fetchable here and its case skips.
      - name: Fetch the public acquisition
        run: python -m tests.real_data.fetch mouse_kidney
      - name: Install nox
        shell: bash
        run: pip install nox[uv]
      - name: Run system tests
        run: nox -s system_tests
