ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
# Rescued artefacts of the aborted refactorings, kept byte-identical to their
# originals on purpose. Reformatting them would destroy the thing being archived.
exclude: ^docs/refactoring/archive/
repos:
  - repo: https://github.com/psf/black
    rev: "24.8.0"
    hooks:
      - id: black
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.18.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]
  # Lint only. `black` above stays the formatter; ruff-format would agree with it at
  # line-length 120, but swapping formatters would mean reformatting the whole repo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.1"
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.6.0"
    hooks:
      - id: check-added-large-files
        # the lockfile is committed deliberately, for reproducibility
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # Fixture-building helpers, not tests: corpus.py writes the differential corpus,
        # datasets.py is the public-data manifest and fetch.py its download CLI. All are
        # imported by the tests rather than collected, so test_*.py does not apply.
        exclude: ^tests/(differential/corpus|real_data/(datasets|fetch))\.py$
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=4"
          - "--no-sort-keys"
  - repo: https://github.com/google/yamlfmt
    rev: "v0.13.0"
    hooks:
      - id: yamlfmt
  - repo: https://github.com/snakemake/snakefmt
    rev: "v0.10.2"
    hooks:
      - id: snakefmt
  - repo: https://github.com/executablebooks/mdformat/
    rev: "0.7.17"
    hooks:
      - id: mdformat
        exclude: "^docs/"
        #  - repo: https://github.com/abravalheri/validate-pyproject
        #    rev: "v0.20.2"
        #    hooks:
        #      - id: validate-pyproject
        #        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.29.2"
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
