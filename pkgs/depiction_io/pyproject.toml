[project]
name = "depiction_io"
version = "0.1.0"
description = "I/O operations for mass spectrometry imaging data"
authors = [{ name = "Leonardo Schwarz", email = "leonardo.schwarz@fgcz.ethz.ch" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.0.0",
    "xarray",
    "pydantic>=2.6.0",
    "pyimzml>=1.5.3",
    "bioio",
    "bioio-ome-tiff>=1.4.0",
    "loguru",
    "h5netcdf",
    "tqdm>=4.66.1",
    "cyclopts",
    "depiction",  # for MultiChannelImage import in ome_tiff.py
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-mock",
    "hypothesis>=6.99.11",
]

dev = [
    "depiction_io[testing]",
    "ruff>=0.3.5",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depiction_io = ["py.typed"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["ANN", "BLE", "D103", "E", "F", "PLW", "PTH", "SIM", "UP", "TCH"]
ignore = ["ANN101", "ANN102", "TCH002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
