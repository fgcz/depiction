[project]
name = "depiction_io"
version = "0.1.0"
description = "Reading and writing mass-spectrometry imaging data."
authors = [{ name = "Leonardo Schwarz", email = "leonardo.schwarz@fgcz.ethz.ch" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">= 3.13"

# Deliberately minimal, and verified by an import scan rather than inherited from the
# parent: notably absent are bioio/bioio-ome-tiff/tifffile, which are only needed by
# OME-TIFF handling -- that lives in `depiction.image`, not here.
dependencies = [
    "numpy>=2.0.0",
    "xarray",
    "pydantic>=2.6.0",
    "tqdm>=4.66.1",
    "loguru",
    # only for the `parse_spectra` debugging entry point
    "cyclopts",
    # the imzy backend (`depiction_io.imzy_backend`). It pulls ~40 transitive packages,
    # which is a real cost for a package that is otherwise deliberately minimal; the
    # justification is in docs/refactoring/ROADMAP.md.
    "imzy>=0.3.0",
    # not imported here: imzy depends on `numba` without any lower bound, and a fresh
    # resolve then satisfies "some numba compatible with the newest numpy" by walking back
    # to numba 0.53 (2021), whose setup.py refuses to build on Python 3.13. 0.61 is the
    # first release that supports 3.13; pinning the floor keeps the numpy ceiling that
    # numba itself declares in play instead.
    "numba>=0.61",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-mock",
    "pytest-pretty",
    "hypothesis>=6.99.11",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.check-tests-structure]
sources_path = "src/depiction_io"
tests_path = "tests/unit"
allow_missing_tests = true
