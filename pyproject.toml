[project]
name = "depiction"
version = "0.1.0"
description = ""
authors = [{ name = "Leonardo Schwarz", email = "leonardo.schwarz@fgcz.ethz.ch" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">= 3.13"

dependencies = [
    "depiction_io",
    "altair>=5.5.0",
    "vl-convert-python",
    "h5py>=3.10.0",
    "matplotlib>=3.8.2",
    "numba>=0.59.0",
    "numpy>=2.0.0",
    "opencv-python>=4.9.0.80",
    "pandas>=2.1.4",
    "pillow>=10.1.0",
    "polars>=0.20.14",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.2",
    "scipy>=1.11.4",
    "seaborn>=0.13.0",
    "snakemake>=9.1",
    "sparse>=0.15.4",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.1",
    "cyclopts",
    "vegafusion[embed]>=2.0.0",
    "xarray",
    "h5netcdf",
    "bioio",
    "bioio-ome-tiff>=1.4.0",
    "bioio-ome-zarr",
    "tifffile",
    "loguru",
    "findmfpy",
    "kdepy>=1.1.8",
    "perlin-noise==1.13",
    "pandera[polars]",
    "spatialdata>=0.7.2",
    # TODO demote to optional again later, but necessary for pycharm right now
    "bfabric",
    "bfabric_app_runner >= 0.5.1",
    "snakemake_invoke @ git+https://github.com/leoschwarz/snakemake_invoke",
]

[project.scripts]
depiction-tools = "depiction.tools.cli.cli:app"

[project.optional-dependencies]
ms_peak_picker = [
    "ms-peak-picker",
]

testing = [
    "coverage>=7.4.3",
    "hypothesis>=6.99.11",
    "pytype>=2023.12.18",
    "logot",
    "pytest",
    "pytest-mock",
    "pytest-pretty",
    # TODO to be explored later
    #"pytest-regtest",
]
dev = [
    "depiction[testing]",
    "bokeh>=3.3.2",
    "hvplot>=0.9.0",
    "jupyterlab>=4.0.9",
    "patchworklib>=0.6.3",
    "pyarrow>=14.0.1",
    "rich>=13.7.0",
    "ruff>=0.3.5",
    "xmltodict",
    "hdbscan",
    "nox[uv]",
    "spatialdata-plot>=0.2.1",
    "types-tqdm",
    "rpy2",
    "pytype",
    "streamlit",
    "quarto-cli",
]
doc = [
    "sphinx",
    "myst-parser",
    "autodoc_pydantic",
    "sphinx-book-theme",
    "sphinx-autobuild",
]
apps = [
    "bfabric"
]
typing = [
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
    "scipy-stubs",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
depiction_targeted_preproc = ["**/*.smk", "**/Snakefile", "**/*.yml", "**/*.yaml"]

[tool.uv]
reinstall-package = ["depiction", "depiction_io"]

[tool.uv.workspace]
members = [".", "pkgs/*"]

[tool.uv.sources]
depiction_io = { workspace = true }

[tool.black]
line-length = 120

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"

[tool.licensecheck]
using = "PEP631"

[tool.ruff]
line-length = 120
indent-width = 4
# must match `requires-python` above; when this said "py39" ruff reported every `match`
# statement in the codebase as a syntax error.
target-version = "py313"

[tool.ruff.lint]
# Deliberately NOT enforced, so that what is left can actually be kept green:
#  - "ANN" / "D103": ~210 pre-existing violations (missing annotations, missing
#    docstrings on public functions) on a codebase heading for an archived state.
#  - "TC": moving an import into a `TYPE_CHECKING` block breaks anything that resolves
#    annotations at runtime, and this project does that in two places at once — pydantic
#    models (e.g. depiction_targeted_preproc/pipeline_config/model.py) and cyclopts CLIs
#    (the various __main__.py). 56 violations, all in that blast radius.
select = ["BLE", "E", "F", "PLW", "PTH", "SIM", "UP"]
# "UP042" (`class Foo(str, Enum)` -> `StrEnum`) is not a cosmetic fix: the two differ in
# `str()` and f-string interpolation ("Foo.X" vs "x"). All six occurrences are config
# enums that flow through pydantic models and snakemake YAML, so converting them is a
# serialization change that belongs in its own commit with its own tests, not in a lint
# sweep.
ignore = ["UP042"]

[tool.coverage.report]
# TODO make it work?
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "compressed_only: differential test that only applies to the zlib-compressed corpus cases",
]

[tool.codespell]
ignore-words-list = "averagine,coo"

[tool.check-tests-structure]
sources_path = "src/depiction"
tests_path = "tests/unit"
allow_missing_tests = true
