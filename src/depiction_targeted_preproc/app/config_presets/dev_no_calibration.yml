process_spectra:
  steps:
    - baseline:
        baseline_type: TopHat
        window_size: 3000
        window_unit: ppm
    - pick:
        peak_picker:
          peak_picker_type: FindMFPy
          int_threshold: 0.0
        force_peak_picker: no
        n_jobs: 10
    - filter:
        filters:
          - method: FilterNHighestIntensityPartitioned
            max_count: 300
            n_partitions: 8
calibration:
  method: null
  n_jobs: 10
