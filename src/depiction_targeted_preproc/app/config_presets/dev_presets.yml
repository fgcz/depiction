process_spectra:
  steps:
    - baseline:
        baseline_type: TopHat
        window_size: 3000
        window_unit: ppm
    - pick:
        peak_picker:
          peak_picker_type: FindMFPy
          int_threshold: 0.0
        force_peak_picker: no
        n_jobs: 10
    - filter:
        filters:
          - method: FilterNHighestIntensityPartitioned
            max_count: 300
            n_partitions: 8
calibration:
  method:
    calibration_method: RegressShift
    max_distance: 3000
    max_distance_unit: ppm
    reg_model_type: linear_siegelslopes
    reg_model_unit: mz
    spatial_smoothing:
      type: Gaussian
      kernel_size: 5
      kernel_std: 1.0
    min_points: 3
  n_jobs: 10
