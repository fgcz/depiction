process_spectra:
  steps:
    - type: baseline_correction
      window_size: 3000
      window_unit: ppm
    - type: pick_peaks
      peak_picker_type: FindMFPy
      int_threshold: 0.0
    - type: filter_peaks
      filters:
        - method: FilterNHighestIntensityPartitioned
          max_count: 300
          n_partitions: 8
  n_jobs: 10
calibration: '...'
